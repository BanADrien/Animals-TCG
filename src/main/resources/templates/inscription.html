
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - Animals TCG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>

<main class="container">
    <h1>Inscription</h1>
    <p>Crée ton compte pour commencer ta collection !</p>

    <div class="erreur" th:if="${erreur}" th:text="${erreur}"></div>

    <form class="formulaire" th:action="@{/inscription}" method="post">
        <label for="pseudo">Pseudo</label>
        <input id="pseudo" type="text" name="pseudo" required maxlength="100">

        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" type="password" name="motDePasse" required>

        <div class="actions">
            <button class="btn" type="submit">S'inscrire</button>
        </div>
    </form>

    <p>Déjà inscrit ? <a th:href="@{/connexion}">Se connecter</a></p>
</main>
</body>
</html>
