spring.application.name=Animals-TCG

# Base MySQL lancee avec docker compose
spring.datasource.url=jdbc:mysql://localhost:3306/animals_tcg
spring.datasource.username=tcg
spring.datasource.password=tcg

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# sinon Tomcat met ;jsessionid=... dans l'URL apres une redirection
server.servlet.session.tracking-modes=cookie

# API iNaturalist (pas besoin de cle)
api.inaturalist.url=https://api.inaturalist.org/v1/taxa

# Regles du jeu
jeu.pieces.depart=100
jeu.booster.prix=50
jeu.vente.doublon=10
